<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sibling selector|attribute selector|pseudo selector|</title>
    <style>
        h2+p{
            color:aquamarine;
        }
        /*attribute selector*/
        input[type="text"]{
            border:2px solid blue;
        }
        /*pseudo selector*/
        input:focus{
            outline:2px solid red;

        }
        a:hover{
            color:yellow;
            background-color: aqua;
        }
        /*pseudo element selector*/
        p::first-letter{
            color:blue;
            font-size: 200%;
        }

    </style>
</head>
<body>
    <h2>css selectors</h2>
    <p>sibling selector:selects the element which are next to each other</p>
    <p>one more paragraph</p>
    <h2>heading tag</h2>
    <!--specifically selct tag orderwise these p and h2 are not applied-->
    <a href="#">click here</a>
    <input type="text" name=" " id="" placeholder="enter email">
    <p>i am learning css</p>
</body>
</html>
