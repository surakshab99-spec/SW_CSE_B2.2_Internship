<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button{
            background-color: rgba(231,203,168);
            padding:10px 20px;
            border-radius:20px;
            transition: background-color 1.3s ease-out ;


        }
    </style>
</head>
<body>
    <p>css transitions allows a property to change smothly from one value to another rather immediately</p>
    <p>transition:property duration timing function</p>
    <button class="button">click me</button>
</body>
</html>
