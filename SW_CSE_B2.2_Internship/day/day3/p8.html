<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video tag</title>
</head>
<body>
    <p>video tag example</p>
    <video src="samplevdo.mp4" controls type="video/mp4"></video>
    <br>
    <video src="samplevdo.mp4" controls autoplay muted height="500" width="500" ></video>
    <br>
    <video src="samplevdo.mp4" controls loop autoplay muted width="640 " height="730"></video>
    <!--thumbail-->
    <br>
    <video src="samplevdo.mp4" controls type="video/mp4" poster="img.jpg"></video>
</body>
</html>
