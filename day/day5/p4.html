<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css colours</title>
    <style>
        .named{
            color:blue;
        }
        .hex{
            color: #00fee0;
        }
        .rgba{
            color:rgb(228, 85, 85)
        }
        /*hue(0-360) saturation lightness+ transparency*/
        .hsl{
            color: hsl(128,100%,50%,0.6);
        }
        .gradient{
            background-image: linear-gradient(red,blue);
        }

    </style>
</head>
<body>
    <p>css colours</p>
    <ol>
        <Li class ="named">
            named colours
        </Li>
        <li class="hex">hex colours</li>
        <li class="rgba">rgb and rgba</li>
        <li class="hsl">hsl and hsla</li>
            <li class="gradient">gradient colour</li>
    </ol>
</body>
</html>
