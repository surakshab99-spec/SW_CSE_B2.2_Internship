<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cssflexbox</title>
    <style>
        .container{
            display:flex;
            border:2px solid blue;
            gap:10px;
            padding: 10px;
            flex-direction: column-reverse;
            margin-top:20px;
        }
        .item {
            background-color: blanchedalmond;
            color:darkred;
            padding: 15px;
            text-align:center;
            

        }
    </style>
</head>
<body>
    <p>css flexbox: is a one dimensional layout system designed to arrange and allign items in a container
        either in a row or column.it makes much easier to create a responsive flexible layuts without the complex postioning or floats.
    </p>
    <div class="container">
        <div class="item">ITEM 1</div>
        <div class="item">ITEM 2</div>
        <div class="item">ITEM 3</div>

    </div>
</body>
</html>
