<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>group selectors</title>
    <style>
        h1,h2,h3{
            color: aliceblue;
            background-color: aquamarine;
        }
        div p{
            color: blueviolet;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        ul > li{
            list-style-type:lower-greek;

        }
    </style>
    

</head>
<body>
    <h3>somputer</h3>
    <h2>science</h2>
    <h1>engineering</h1>
    <!--descendent selector-->
    <div>
        <p>this paragraph here is to depict the use of descendent selector</p>
    </div>
    <p>this is normsl paragraph</p>
    <!--child selector-->
    <p>selsctors</p>
    <ul>
        <li>child selector
        </li>
        <li>group selectors</li>

    </ul>
</body>
</html>
