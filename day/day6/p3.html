<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS animations</title>
    <style>
        .box{
            background-color: chocolate;
            width:100px;
            height: 100px;
            animation-name: slide;
            animation-duration: 5s;
            animation-timing-function: ease-in-out;
            animation-play-state: running;
            transform: scale(5px);
            border-radius: 50PX;
        }
        @keyframes slide {
            from{
                transform: translateX(0);
            }
            to{
                transform: translateX(200px);
            }
            
        }
        .bouncing-box{
            background-color: blueviolet;
            width:100px;
            height:100px;
            animation: bounce 1s ease-in-out;
            animation-delay: 5s;
            animation-iteration-count: 3;
            
        }
        @keyframes bounce{
            0%{
                transform: translateY(0);       }
            50%{
                transform: translateY(-20);
            }
            100%{
                transform:translateY(100);
            }

        }

    </style>
</head>
<body>
    <!--css animations-->
    css animation allows an element to gradually change between different styles without javascript
    @keyframes:define the animation stages and animation properties to control timing ,repetation,direction,playback 
    <div class="box">box</div>
    <div class="bouncing-box">box</div>

</body>
</html>
