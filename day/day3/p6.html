<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spanning rows and columns</title>
</head>
<body>
    <h4>columnspan</h4>
    <table border=""2>
        <tr>
            <th colspan="2">student details</th>
        </tr>
        <tr><td colspan="3">name</td>
        <td colspan="=3">suraksha</td></tr>
        <tr>
            <td>courses</td>
            <td>full stack</td>
            </td> genai</td>
        </tr>
    </table>
    <hr>
    <h4>rowspan</h4>
    <!--rowspan-->
    <table border="2">
        <tr>
            <th rowspan="2">day</th>
            <th>morning</th>
            <th>evening</th>
        </tr>
        <tr>
            <td>react js practice</td>
            <td>backend practice</td>
        </tr>
    </table>
    
</body>
</html>
